        }
    </style>

    <div class="bg-slate-900 text-white w-screen h-screen relative overflow-hidden">


        <!-- Canvas Principal de la Simulación -->

        <!-- Header & Controles Flotantes -->
        <div class="absolute top-4 left-4 right-4 z-10 flex justify-between items-center pointer-events-none">
            <div class="glass-panel px-5 py-3 rounded-2xl pointer-events-auto flex items-center space-x-3 shadow-lg">
                <div class="p-2 bg-cyan-500/20 text-cyan-300 rounded-xl">
                    <i data-lucide="waves" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white tracking-wide">Mar & Arena Live</h1>
                    <p class="text-xs text-cyan-200/80 font-medium">Simulación interactiva 2D</p>
                </div>
            </div>

            <!-- Botones Rápidos de Control Superior -->
            <div class="flex items-center space-x-2 pointer-events-auto">
                <button id="toggleAudioBtn"

                <button id="togglePanelBtn"
                    class="glass-panel p-3 rounded-2xl text-white hover:bg-white/20 transition-all duration-300 active:scale-95 shadow-lg flex items-center justify-center">
                    <i data-lucide="sliders" class="w-5 h-5 text-cyan-200"></i>

            </div>
        </div>

        <!-- Indicador de Interacción Inicial -->
        <div id="hintToast"
            class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 pointer-events-none transition-opacity duration-700 opacity-90">
            <div
                class="glass-panel px-4 py-2 rounded-full text-xs text-white/90 font-medium flex items-center space-x-2 shadow-lg border border-white/20">
                <i data-lucide="hand" class="w-4 h-4 text-cyan-300 animate-pulse"></i>
                <span>Arrastra para dibujar en la arena | Haz clic para crear salpicaduras</span>
            </div>
        </div>

        <!-- Panel Lateral Desplegable de Configuración -->
        <div id="controlPanel"
            class="absolute top-20 right-4 z-20 w-80 max-w-[calc(100vw-2rem)] glass-panel rounded-3xl p-5 shadow-2xl transition-all duration-500 transform translate-x-[120%] opacity-0 pointer-events-auto border border-white/20">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-white/10">
                <h2 class="text-sm font-bold uppercase tracking-wider text-cyan-200 flex items-center gap-2">
                    <i data-lucide="settings-2" class="w-4 h-4"></i> Ajustes del Paisaje
                </h2>
                <button id="closePanelBtn" class="text-white/60 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-4 max-h-[70vh] overflow-y-auto pr-1">
                <!-- Selección de Ambiente / Hora del Día -->
                <div>
                    <label class="text-xs font-semibold text-white/80 block mb-2">Ambiente y Luz</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button data-preset="day"
                            class="preset-btn active bg-white/20 hover:bg-white/30 text-white text-xs py-2 px-3 rounded-xl border border-white/30 flex items-center justify-center space-x-1.5 transition">
                            <i data-lucide="sun" class="w-3.5 h-3.5 text-amber-300"></i>
                            <span>Día Soleado</span>
                        </button>
                        <button data-preset="sunset"
                            class="preset-btn bg-white/10 hover:bg-white/20 text-white/80 text-xs py-2 px-3 rounded-xl border border-white/10 flex items-center justify-center space-x-1.5 transition">
                            <i data-lucide="sunset" class="w-3.5 h-3.5 text-orange-400"></i>
                            <span>Atardecer</span>
                        </button>
                        <button data-preset="night"
                            class="preset-btn bg-white/10 hover:bg-white/20 text-white/80 text-xs py-2 px-3 rounded-xl border border-white/10 flex items-center justify-center space-x-1.5 transition">
                            <i data-lucide="moon" class="w-3.5 h-3.5 text-indigo-300"></i>
                            <span>Noche</span>
                        </button>
                        <button data-preset="storm"
                            class="preset-btn bg-white/10 hover:bg-white/20 text-white/80 text-xs py-2 px-3 rounded-xl border border-white/10 flex items-center justify-center space-x-1.5 transition">
                            <i data-lucide="cloud-rain" class="w-3.5 h-3.5 text-teal-300"></i>
                            <span>Tormenta</span>
                        </button>
                    </div>
                </div>

                <!-- Ajuste de Altura de la Marea -->
                <div class="pt-2 border-t border-white/10">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-white/80">Alcance de Marea</label>
                        <span id="tideVal" class="text-xs font-mono text-cyan-300">60%</span>
                    </div>
                    <input id="tideSlider" type="range" min="30" max="85" value="60"
                        class="w-full accent-cyan-400 bg-white/20 rounded-lg h-1.5 cursor-pointer">
                </div>

                <!-- Ajuste de Intensidad de las Olas -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-white/80">Fuerza del Oleaje</label>
                        <span id="waveVal" class="text-xs font-mono text-cyan-300">Medio</span>
                    </div>
                    <input id="waveSlider" type="range" min="1" max="5" step="0.5" value="2.5"
                        class="w-full accent-cyan-400 bg-white/20 rounded-lg h-1.5 cursor-pointer">
                </div>

                <!-- Volumen General -->
                <div class="pt-2 border-t border-white/10">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-white/80">Volumen del Mar</label>
                        <span id="volVal" class="text-xs font-mono text-cyan-300">50%</span>
                    </div>
                    <input id="volSlider" type="range" min="0" max="100" value="50"
                        class="w-full accent-cyan-400 bg-white/20 rounded-lg h-1.5 cursor-pointer">
                </div>

                <!-- Pincel de Arena -->
                <div class="pt-2 border-t border-white/10">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-white/80">Grosor de Trazo / Huella</label>
                        <span id="brushVal" class="text-xs font-mono text-amber-300">25px</span>
                    </div>
                    <input id="brushSlider" type="range" min="10" max="60" value="25"
                        class="w-full accent-amber-400 bg-white/20 rounded-lg h-1.5 cursor-pointer">
                </div>
            </div>
        </div>
    </div>
    <script>
        // ==========================================
        // 1. GENERADOR DE AUDIO CON WEB AUDIO API
        // ==========================================
        class OceanAudio {
            constructor() {
                this.ctx = null;
                this.isMuted = true;
                this.masterGain = null;
                this.waveGain = null;
                this.noiseNode = null;
                this.filter = null;
                this.volume = 0.5;
                this.isInitialized = false;
            }

            init() {
                if (this.isInitialized) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();

                    // Master Gain
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = 0;
                    this.masterGain.connect(this.ctx.destination);

                    // Generador de Ruido Rosa para Olas
                    const bufferSize = 2 * this.ctx.sampleRate;
                    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        b0 = 0.99886 * b0 + white * 0.0555179;
                        b1 = 0.99332 * b1 + white * 0.0750759;
                        b2 = 0.96900 * b2 + white * 0.1538520;
                        b3 = 0.86650 * b3 + white * 0.3104856;
                        b4 = 0.55000 * b4 + white * 0.5329522;
                        b5 = -0.7616 * b5 - white * 0.0168980;
                        output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                        output[i] *= 0.11;
                        b6 = white * 0.115926;
                    }

                    this.noiseNode = this.ctx.createBufferSource();
                    this.noiseNode.buffer = noiseBuffer;
                    this.noiseNode.loop = true;

                    // Filtro de frecuencia suave
                    this.filter = this.ctx.createBiquadFilter();
                    this.filter.type = 'lowpass';
                    this.filter.frequency.value = 350;

                    this.waveGain = this.ctx.createGain();
                    this.waveGain.gain.value = 0.3;

                    this.noiseNode.connect(this.filter);
                    this.filter.connect(this.waveGain);
                    this.waveGain.connect(this.masterGain);

                    this.noiseNode.start(0);
                    this.isInitialized = true;
                } catch (e) {
                    console.warn("Web Audio API no soportado o bloqueado", e);
                }
            }

            toggle() {
                if (!this.isInitialized) this.init();
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                this.isMuted = !this.isMuted;
                if (this.masterGain) {
                    const now = this.ctx.currentTime;
                    this.masterGain.gain.linearRampToValueAtTime(
                        this.isMuted ? 0 : this.volume,
                        now + 0.5
                    );
                }
                return !this.isMuted;
            }

            setVolume(val) {
                this.volume = val;
                if (!this.isMuted && this.masterGain) {
                    this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
                }
            }

            // Modular sonido según el movimiento de las olas
            updateWaveSound(waveHeightRatio) {
                if (this.isMuted || !this.filter || !this.ctx) return;
                const now = this.ctx.currentTime;
                // Ajustar frecuencia según cresta de ola
                const targetFreq = 200 + waveHeightRatio * 600;
                const targetGain = 0.15 + waveHeightRatio * 0.35;

                this.filter.frequency.setTargetAtTime(targetFreq, now, 0.2);
                this.waveGain.gain.setTargetAtTime(targetGain, now, 0.2);
            }

            // Reproducir sonido de salpicadura
            playSplash() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);

                gain.gain.setValueAtTime(0.15 * this.volume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // ==========================================
        // 2. CONFIGURACIÓN Y TEMAS VISUALES
        // ==========================================
        const canvas = document.getElementById('beachCanvas');
        const ctx = canvas.getContext('2d');

        // Canvases secundarios para texturas (Offscreen Rendering)
        const sandCanvas = document.createElement('canvas');
        const sandCtx = sandCanvas.getContext('2d');
        const trailCanvas = document.createElement('canvas');
        const trailCtx = trailCanvas.getContext('2d');

        const audio = new OceanAudio();

        // Temas de Luz / Ambiente
        const PRESETS = {
            day: {
                skyTop: '#38bdf8',
                skyBottom: '#bae6fd',
                waterDeep: '#0284c7',
                waterMid: '#06b6d4',
                waterShallow: '#67e8f9',
                foamColor: 'rgba(255, 255, 255, 0.85)',
                sandBase: '#fef08a',
                sandWet: '#ca8a04',
                sandGrain: '#eab308',
                sunColor: 'rgba(255, 253, 224, 0.9)',
                sunGlow: 'rgba(253, 224, 71, 0.3)',
                sparkleColor: '255, 255, 255'
            },
            sunset: {
                skyTop: '#4c1d95',
                skyBottom: '#fb923c',
                waterDeep: '#1e1b4b',
                waterMid: '#9333ea',
                waterShallow: '#f43f5e',
                foamColor: 'rgba(254, 215, 170, 0.85)',
                sandBase: '#f97316',
                sandWet: '#7c2d12',
                sandGrain: '#c2410c',
                sunColor: 'rgba(255, 237, 213, 0.95)',
                sunGlow: 'rgba(249, 115, 22, 0.5)',
                sparkleColor: '254, 215, 170'
            },
            night: {
                skyTop: '#030712',
                skyBottom: '#1e1b4b',
                waterDeep: '#0f172a',
                waterMid: '#1e293b',
                waterShallow: '#334155',
                foamColor: 'rgba(203, 213, 225, 0.65)',
                sandBase: '#475569',
                sandWet: '#0f172a',
                sandGrain: '#334155',
                sunColor: 'rgba(241, 245, 249, 0.95)',
                sunGlow: 'rgba(148, 163, 184, 0.2)',
                sparkleColor: '148, 163, 184'
            },
            storm: {
                skyTop: '#111827',
                skyBottom: '#374151',
                waterDeep: '#0f172a',
                waterMid: '#134e4a',
                waterShallow: '#115e59',
                foamColor: 'rgba(241, 245, 249, 0.9)',
                sandBase: '#71717a',
                sandWet: '#27272a',
                sandGrain: '#52525b',
                sunColor: 'rgba(156, 163, 175, 0.3)',
                sunGlow: 'rgba(75, 85, 99, 0.2)',
                sparkleColor: '209, 213, 219'
            }
        };

        let currentPreset = 'day';
        let config = {
            tideMaxHeight: 0.60, // Porcentaje de la pantalla
            waveStrength: 2.5,
            brushRadius: 25,
            timeSpeed: 0.015
        };

        // Estado del Sistema
        let width = 0;
        let height = 0;
        let time = 0;
        let mouse = {x: -1000, y: -1000, isDown: false, px: -1000, py: -1000};
        let ripples = [];
        let sparkles = [];

        // Resize Handler
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width;
            canvas.height = height;

            sandCanvas.width = width;
            sandCanvas.height = height;

            trailCanvas.width = width;
            trailCanvas.height = height;

            generateSandTexture();
            generateSparkles();
        }

        // Generar textura estática de la arena con partículas/granos
        function generateSandTexture() {
            const theme = PRESETS[currentPreset];

            // Fondo Base Arena
            sandCtx.fillStyle = theme.sandBase;
            sandCtx.fillRect(0, 0, width, height);

            // Generar Granos de Arena
            const grainCount = (width * height) / 40;
            for (let i = 0; i < grainCount; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const radius = Math.random() * 1.2 + 0.3;
                const alpha = Math.random() * 0.25 + 0.05;

                sandCtx.fillStyle = theme.sandGrain;
                sandCtx.globalAlpha = alpha;
                sandCtx.beginPath();
                sandCtx.arc(x, y, radius, 0, Math.PI * 2);
                sandCtx.fill();
            }
            sandCtx.globalAlpha = 1.0;
        }

        // Generar destellos luminosos en la arena
        function generateSparkles() {
            sparkles = [];
            const count = Math.floor((width * height) / 15000);
            for (let i = 0; i < count; i++) {
                sparkles.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.8 + height * 0.2,
                    size: Math.random() * 2 + 0.5,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.02 + Math.random() * 0.03
                });
            }
        }

        // ==========================================
        // 3. EVENTOS E INTERACTIVIDAD (MOUSE/TOUCH)
        // ==========================================
        function addRipple(x, y, power = 1) {
            ripples.push({
                x: x,
                y: y,
                radius: 5,
                maxRadius: 40 + power * 30,
                alpha: 0.8,
                speed: 1.5 + power
            });
            audio.playSplash();
        }

        function drawTrail(x, y, radius) {
            trailCtx.globalCompositeOperation = 'source-over';

            // Textura del dibujo/huella excavada en la arena
            const theme = PRESETS[currentPreset];
            const grad = trailCtx.createRadialGradient(x, y, 0, x, y, radius);
            grad.addColorStop(0, theme.sandWet);
            grad.addColorStop(0.7, theme.sandWet);
            grad.addColorStop(1, 'transparent');

            trailCtx.fillStyle = grad;
            trailCtx.beginPath();
            trailCtx.arc(x, y, radius, 0, Math.PI * 2);
            trailCtx.fill();
        }

        // Event Listeners para Mouse y Touch
        function handlePointerMove(x, y) {
            if (mouse.isDown) {
                // Dibujar en la arena
                drawTrail(x, y, config.brushRadius);

                // Si el toque ocurre en el agua, crear ondas
                if (y < height * config.tideMaxHeight + 50) {
                    if (Math.hypot(x - mouse.px, y - mouse.py) > 20) {
                        addRipple(x, y, 0.5);
                    }
                }
            }
            mouse.px = mouse.x;
            mouse.py = mouse.y;
            mouse.x = x;
            mouse.y = y;
        }

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.isDown = true;
            handlePointerMove(e.clientX, e.clientY);
            addRipple(e.clientX, e.clientY, 1.2);
        });

        window.addEventListener('mousemove', (e) => {
            handlePointerMove(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', () => mouse.isDown = false);

        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.isDown = true;
            const touch = e.touches[0];
            handlePointerMove(touch.clientX, touch.clientY);
            addRipple(touch.clientX, touch.clientY, 1);
        });

        window.addEventListener('touchmove', (e) => {
            if (!mouse.isDown) return;
            const touch = e.touches[0];
            handlePointerMove(touch.clientX, touch.clientY);
        });

        window.addEventListener('touchend', () => mouse.isDown = false);

        // ==========================================
        // 4. BUCLE DE RENDERIZADO Y FÍSICA
        // ==========================================
        function render() {
            time += config.timeSpeed;
            const theme = PRESETS[currentPreset];

            // A. DIBUJAR FONDO BASE (ARENA)
            ctx.drawImage(sandCanvas, 0, 0);

            // B. DIBUJAR DESTELLOS DE LA ARENA (SPARKLES)
            ctx.fillStyle = `rgba(${theme.sparkleColor}, 0.8)`;
            sparkles.forEach(s => {
                s.phase += s.speed;
                const alpha = (Math.sin(s.phase) + 1) / 2 * 0.6;
                if (alpha > 0.1) {
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1.0;

            // C. APLICAR HUELLAS / DIBUJOS DE LA ARENA
            ctx.drawImage(trailCanvas, 0, 0);

            // D. CÁLCULO DE LA MAREA Y OLAS
            // La marea oscila con una onda sinusoidal lenta
            const tideCycle = Math.sin(time * 0.8);
            const currentTideY = height * (1 - config.tideMaxHeight) + tideCycle * 60;
            const waveRatio = (Math.sin(time * 0.8) + 1) / 2; // 0 a 1

            // Sonido reactivo al movimiento de la ola
            audio.updateWaveSound(waveRatio);

            // E. BORRADO PROGRESIVO DE HUELLAS CUANDO EL AGUA AVANZA
            // Usar Destination-Out en el canvas de trazos según la profundidad del agua
            trailCtx.globalCompositeOperation = 'destination-out';
            const foamWashY = currentTideY + Math.sin(time * 2) * 15;
            const fadeGrad = trailCtx.createLinearGradient(0, foamWashY - 40, 0, foamWashY + 60);
            fadeGrad.addColorStop(0, 'rgba(0, 0, 0, 0.15)');
            fadeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            trailCtx.fillStyle = fadeGrad;
            trailCtx.fillRect(0, 0, width, height);

            // F. DIBUJAR EL MAR (CAPAS DE AGUA MULTI-ONDA)
            const numWaves = 4;
            for (let w = 0; w < numWaves; w++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);

                const waveOffset = w * 18;
                const speedMult = 1 + w * 0.3;
                const waveAmp = (15 + w * 10) * (config.waveStrength / 2);

                // Dibujar línea horizontal deformada por senos/cosenos
                for (let x = 0; x <= width; x += 15) {
                    // Combinación de múltiples frecuencias para realismo
                    let y = currentTideY + waveOffset;
                    y += Math.sin(x * 0.008 + time * speedMult + w) * waveAmp;
                    y += Math.cos(x * 0.015 - time * 0.5) * (waveAmp * 0.5);

                    // Interacción local con el mouse
                    const distToMouse = Math.hypot(x - mouse.x, y - mouse.y);
                    if (distToMouse < 150) {
                        const push = (1 - distToMouse / 150) * 20;
                        y += Math.sin(distToMouse * 0.1 - time * 4) * push;
                    }

                    if (x === 0) ctx.lineTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.lineTo(width, 0);
                ctx.closePath();

                // Colores de capas de agua (Agua Sombría a Agua Profunda)
                let waterGrad = ctx.createLinearGradient(0, 0, 0, currentTideY + 100);
                if (w === 0) {
                    waterGrad.addColorStop(0, theme.waterDeep);
                    waterGrad.addColorStop(1, theme.waterMid);
                    ctx.fillStyle = waterGrad;
                    ctx.globalAlpha = 0.95;
                } else if (w === 1) {
                    waterGrad.addColorStop(0, theme.waterMid);
                    waterGrad.addColorStop(1, theme.waterShallow);
                    ctx.fillStyle = waterGrad;
                    ctx.globalAlpha = 0.8;
                } else {
                    waterGrad.addColorStop(0, theme.waterShallow);
                    waterGrad.addColorStop(1, 'rgba(255,255,255,0.2)');
                    ctx.fillStyle = waterGrad;
                    ctx.globalAlpha = 0.4 + w * 0.15;
                }

                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // G. RENDERING DE LA ESPUMA DE LA OLA (FOAM)
            ctx.beginPath();
            let foamPoints = [];
            for (let x = 0; x <= width; x += 10) {
                let y = currentTideY + 30;
                y += Math.sin(x * 0.008 + time * 1.3) * (20 * config.waveStrength / 2);
                y += Math.cos(x * 0.02 + time * 0.8) * 8;
                foamPoints.push({x, y});
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.lineTo(width, 0);
            ctx.lineTo(0, 0);
            ctx.closePath();

            // Dibujar Borde de Espuma Suave
            ctx.strokeStyle = theme.foamColor;
            ctx.lineWidth = 6 + config.waveStrength * 2;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Partículas de Espuma / Burbujas
            ctx.fillStyle = theme.foamColor;
            for (let i = 0; i < foamPoints.length; i += 2) {
                const pt = foamPoints[i];
                const bubbleRadius = Math.random() * 3 + 1;
                ctx.beginPath();
                ctx.arc(pt.x + (Math.random() - 0.5) * 20, pt.y + Math.random() * 12, bubbleRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            // H. ACTUALIZAR Y DIBUJAR ONDAS (RIPPLES)
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.radius += r.speed;
                r.alpha -= 0.015;

                if (r.alpha <= 0 || r.radius >= r.maxRadius) {
                    ripples.splice(i, 1);
                    continue;
                }

                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${r.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            requestAnimationFrame(render);
        }

        // ==========================================
        // 5. VINCULACIÓN DE CONTROLES E INTERFAZ
        // ==========================================
        window.addEventListener('resize', resize);

        // Control Panel Toggle
        const controlPanel = document.getElementById('controlPanel');
        const togglePanelBtn = document.getElementById('togglePanelBtn');
        const closePanelBtn = document.getElementById('closePanelBtn');

        function togglePanel() {
            const isOpen = !controlPanel.classList.contains('translate-x-[120%]');
            if (isOpen) {
                controlPanel.classList.add('translate-x-[120%]', 'opacity-0');
                controlPanel.classList.remove('translate-x-0', 'opacity-100');
            } else {
                controlPanel.classList.remove('translate-x-[120%]', 'opacity-0');
                controlPanel.classList.add('translate-x-0', 'opacity-100');
            }
        }

        togglePanelBtn.addEventListener('click', togglePanel);
        closePanelBtn.addEventListener('click', togglePanel);

        // Presets (Día, Atardecer, Noche, Tormenta)
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.preset-btn').forEach(b => {
                    b.classList.remove('active', 'bg-white/20');
                    b.classList.add('bg-white/10');
                });
                const target = e.currentTarget;
                target.classList.add('active', 'bg-white/20');

                currentPreset = target.dataset.preset;
                generateSandTexture();
            });
        });

        // Sliders
        const tideSlider = document.getElementById('tideSlider');
        const tideVal = document.getElementById('tideVal');
        tideSlider.addEventListener('input', (e) => {
            config.tideMaxHeight = e.target.value / 100;
            tideVal.textContent = `${e.target.value}%`;
        });

        const waveSlider = document.getElementById('waveSlider');
        const waveVal = document.getElementById('waveVal');
        waveSlider.addEventListener('input', (e) => {
            config.waveStrength = parseFloat(e.target.value);
            const labels = {1: 'Calma', 2.5: 'Medio', 4: 'Fuerte', 5: 'Marea Alta'};
            waveVal.textContent = labels[config.waveStrength] || `${config.waveStrength}x`;
        });

        const volSlider = document.getElementById('volSlider');
        const volVal = document.getElementById('volVal');
        volSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            volVal.textContent = `${val}%`;
            audio.setVolume(val / 100);
        });

        const brushSlider = document.getElementById('brushSlider');
        const brushVal = document.getElementById('brushVal');
        brushSlider.addEventListener('input', (e) => {
            config.brushRadius = parseInt(e.target.value);
            brushVal.textContent = `${e.target.value}px`;
        });

        // Toggle Audio
        const toggleAudioBtn = document.getElementById('toggleAudioBtn');
        const audioIcon = document.getElementById('audioIcon');

        toggleAudioBtn.addEventListener('click', () => {
            const active = audio.toggle();
            if (active) {
                audioIcon.setAttribute('data-lucide', 'volume-2');
                audioIcon.className = 'w-5 h-5 text-emerald-300';
            } else {
                audioIcon.setAttribute('data-lucide', 'volume-x');
                audioIcon.className = 'w-5 h-5 text-rose-300';
            }
            lucide.createIcons();
        });

        // Limpiar Arena
        document.getElementById('clearSandBtn').addEventListener('click', () => {
            trailCtx.clearRect(0, 0, width, height);
        });

        // Ocultar hint toast tras interactuar
        window.addEventListener('mousedown', () => {
            const hint = document.getElementById('hintToast');
            if (hint) hint.classList.add('opacity-0');
        }, {once: true});

        // Inicialización General
        window.onload = () => {
            lucide.createIcons();
            resize();
            render();
        };
    </script>
</body>

</html>
